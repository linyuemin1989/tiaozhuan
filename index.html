<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请选择跳转链接</title>
  <style>
    body { font-family: sans-serif; padding: 30px; text-align: center; background: #f9f9f9; }
    h2 { color: #333; margin-bottom: 20px; }
    .link-box {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      margin: 20px auto;
      padding: 20px;
      max-width: 90%;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 5px;
      margin-top: 10px;
    }
    input {
      width: 90%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
    }
    .name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #222;
    }
  </style>
</head>
<body>
  <h2>请选择要打开的链接</h2>

  <div class="link-box">
    <div class="name">小金莲</div>
    <input id="link1" value="https://sisxhasas798.hebjiuhong.com/index?userId=251" readonly>
    <br>
    <button onclick="copyLink('link1')">复制链接</button>
  </div>

  <div class="link-box">
    <div class="name">久伴</div>
    <input id="link2" value="https://static1.laiyifen.com/files/broadcast-grapher-app-api/image/9c7a5ad377324e328b81e06b1a0da36a.html?code=085608" readonly>
    <br>
    <button onclick="copyLink('link2')">复制链接</button>
  </div>

  <p style="margin-top:30px; font-size:13px; color:#aaa;">提示：请复制链接到浏览器打开，微信中无法直接访问。</p >

  <script>
    function copyLink(id) {
      const input = document.getElementById(id);
      input.select();
      input.setSelectionRange(0, 99999); // for mobile
      document.execCommand("copy");
      alert("链接已复制，请粘贴到手机浏览器打开");
    }
  </script>
</body>
</html>
